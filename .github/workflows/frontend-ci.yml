name: Frontend CI/CD

on:
  push:
    branches: [ master, appmod/java-upgrade-* ]
    paths:
      - 'placement-tracker-frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'placement-tracker-frontend/**'

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: 'placement-tracker-frontend/package-lock.json'

    - name: Install dependencies
      run: cd placement-tracker-frontend && npm ci

    - name: Run linter
      run: cd placement-tracker-frontend && npm run lint
      continue-on-error: true

    - name: Build
      run: cd placement-tracker-frontend && npm run build

    - name: Upload build artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: frontend-dist-node${{ matrix.node-version }}
        path: placement-tracker-frontend/dist/
